name: tests
# Deliberately manual-trigger-only (workflow_dispatch), not [push, pull_request]:
# the user has no GitHub Actions credit budget and asked that nothing run here
# automatically. This workflow costs nothing until someone deliberately runs
# it from the Actions tab. Switching back to [push, pull_request] is a
# one-line edit when that's wanted.
on: [workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.jolt"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Install GTK4
        # Not because anything here calls GTK — this renderer is AppKit only.
        # glitter declares GTK4 under :jolt/native and jolt inherits a
        # dependency's natives transitively, hard-failing in load-natives!
        # before any namespace loads. See README's Requirements section.
        run: sudo apt-get install -y libgtk-4-1
      - name: Test
        # deps.edn pins glitter via :git/url + :git/sha (io.github.burinc/glitter)
        # rather than :local/root, so jolt clones it itself during dependency
        # resolution — no sibling checkout of burinc/glitter needed here.
        # Verified against jolt.deps (jolt-core/jolt/deps.clj): git coordinates
        # are fetched with a plain `git clone` over HTTPS into jolt's own
        # gitlibs cache; ubuntu-latest ships git and has outbound network
        # access, so no extra setup is required for that fetch to succeed.
        run: JOLT_PWD="$PWD" jolt -M:test
