name: CI

# ---------------------------------------------------------------------------
# Runs on pull requests and pushes to main, plus manual dispatch.
#
# macos-latest, NOT ubuntu. This is not a preference: the unit suite constructs
# real AppKit views (w/create! appears at 26 call sites across appkit_test,
# container_test and controls_test), and AppKit does not exist on Linux. An
# earlier version of this workflow ran on ubuntu-latest and would have failed
# the first time anyone dispatched it — it never did, so nothing surfaced it.
#
# TWO JOBS, split on what each gate actually needs:
#
#   lint   ubuntu-latest   clj-kondo only. Pure static analysis over src/test/
#                          examples — no classpath, no jolt, no GTK, no AppKit.
#                          Runs in seconds and needs none of the install steps
#                          below, which is the point: it still catches lint drift
#                          whenever macOS runners are unavailable.
#
#   test   macos-latest    the unit suite plus the two clojure-lsp gates.
#                          The suite constructs real AppKit views (w/create! at
#                          26 call sites across appkit_test, container_test and
#                          controls_test) and AppKit does not exist on Linux;
#                          clojure-lsp's format and clean-ns need a resolved
#                          classpath, so both belong on the same machine.
#
# Scope: HEADLESS ONLY. The eight live-AppKit smokes (`bb smokes`) open real
# windows and need a GUI session, so they stay a local/maintainer gate — see
# CONTRIBUTING.md.
# ---------------------------------------------------------------------------

# This block used to say the workflow could not run at all, and prescribed its
# own undoing: "re-enabling is a three-line edit once billing allows it".
#
# It was true when written. The repo sat on an account whose Actions were
# blocked at the billing level, a push-triggered run failed in 3s with "recent
# account payments have failed or your spending limit needs to be increased",
# and a seven-line ubuntu echo dispatched to isolate the cause queued forever
# without ever being assigned a runner. Manual-only was right then, because an
# automatic trigger would have put a red X on every commit.
#
# Two measurements say billing now allows it:
#
#   run 33023130827   2026-08-26T23:22Z   workflow_dispatch, BOTH jobs success
#   this repo now sits under jlt-commons, whose sibling projects run Actions on
#   every pull request
#
# So the triggers the old note prescribed are restored below. Its billing
# footnote is worth keeping: macos-latest bills at a 10x minute multiplier on
# PRIVATE repos, while standard runners are free for PUBLIC ones, so the
# calculus changes with visibility. This repo is public.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "jolt version to install (blank = the pinned JOLT_VERSION below)"
        required: false
        default: ""

permissions:
  contents: read

# jolt is pinned for the same reason clj-kondo, clojure-lsp and babashka are
# pinned further down: a floating `latest` lets a release published overnight
# turn CI red on a tree nobody touched.
#
# So moving this pin IS the cutover commit for a breaking jolt change. Bump it
# and adapt the call sites together, in one reviewed commit, rather than letting
# the release date decide when main breaks. Try a candidate first with a
# workflow_dispatch run and the jolt-version input, which overrides this for
# that run only.
#
# The pin reads 0.8.0 because jolt-lang/jolt#802 reverses ffi/write's last two
# arguments and this tree is written for the new order. An older jolt writes to
# the wrong place and reports nothing, so installing one here is not a thing to
# leave to whatever happens to be newest on the day.
#
# THIS PIN IS THE ONLY THING GUARDING THAT. deps.edn's :jolt/min-version does
# not, however much it reads like it does. jolt honours that key only from #804,
# which merged 17 minutes AFTER #802 (22:24:59Z against 22:07:42Z on
# 2026-08-31), so every runtime old enough to have the old write order is also
# too old to read the key and ignores it. The two populations cannot overlap.
#
# Measured against the released v0.7.29, which predates both, with the 0.8.0
# floor present in deps.edn: it did not refuse. It ran, dropped
# glitter-uikit.appkit-test and glitter-uikit.controls-test with "ERROR
# requiring ... : nil", and reported "Ran 19 tests. 61 assertions passed, 0
# failures, 0 errors" against the 37 tests and 127 assertions a correct run
# gives. A green half-suite on a runtime that writes to the wrong address is
# the exact failure the floor looks like it prevents. Keep the floor for the
# NEXT break, when both sides of it can read the key, and keep this pin for
# this one.
env:
  JOLT_VERSION: ${{ inputs.jolt-version || '0.8.1' }}

  # Which jolt repository to install FROM. Upstream unless overridden, which is
  # every ordinary run.
  #
  # It exists so this project can be built against an UNRELEASED jolt. jolt's
  # install script resolves --version to a published release, and only releases
  # exist upstream, so a nightly lives on whichever fork produced it. Setting the
  # repository variable JOLT_REPO points both the installer fetch and the
  # download at that fork.
  #
  # Passed as an env var rather than a --repo flag, so one command covers both:
  # upstream's installer does not know JOLT_REPO and ignores it, while a fork's
  # installer that supports it honours it. A flag would fail against upstream,
  # which rejects unknown flags.
  JOLT_REPO: ${{ vars.JOLT_REPO || 'jolt-lang/jolt' }}

jobs:
  lint:
    name: clj-kondo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No jolt and no GTK here on purpose. clj-kondo reads source; it does not
      # resolve dependencies or load a single native library, so this job stays
      # fast and has no reason to fail for environment reasons.
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          clj-kondo: "2026.05.25"

      # `.clj-kondo/hooks/jolt_ffi.clj` rewrites jolt.ffi/defcfn into an
      # equivalent defn so clj-kondo can see through the FFI macro. Without it
      # every objc-msg-send-* binding reports as unresolved. The hook also
      # models by-value aggregate returns, which take an implicit output buffer
      # as their first argument.
      #
      # Errors only — the SAME invocation bb hooks:install writes into the
      # pre-commit hook, so CI and a clean local commit agree. bb lint:strict
      # would additionally fail on warnings and would disagree with the hook.
      - name: clj-kondo
        run: clj-kondo --lint src test examples

  test:
    name: test · format · ns
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Not because anything here calls GTK — this renderer is AppKit only.
      # glitter declares GTK4 under :jolt/native, and jolt inherits a
      # dependency's natives transitively and hard-fails in load-natives!
      # before any namespace loads. See CONTRIBUTING.md's Status note.
      - name: Install GTK4
        run: |
          set -euo pipefail
          brew install gtk4
          echo "::group::what resolved"
          ls -1 "$(brew --prefix)/lib" | grep -E 'libgtk-4|libglib-2\.0|libgobject-2\.0|libgio-2\.0' || true
          echo "::endgroup::"

      # Official install script from jolt's README, which owns the archive
      # naming and verifies the checksum. $JOLT_VERSION comes from the
      # workflow-level env above and is read by the script rather than
      # interpolated into it, so the dispatch input cannot inject shell.
      #
      # Fetched from api.github.com, NOT raw.githubusercontent.com. The raw
      # host answers anonymous requests out of a pool shared across all of
      # GitHub's hosted runners, and it returned 403 twice on 2026-08-31 with
      # `curl: (56) The requested URL returned error: 403`, on main at 06:01Z
      # and on pull request #3 at 22:19Z. Both times every later step skipped,
      # so the red X said nothing about the tree. The API host takes the
      # workflow token, which bills the request to this repo's own quota. It
      # serves byte-identical content: verified with `diff` against the raw
      # host, 204 lines, no difference.
      #
      # Retried anyway, because one 403 should not cost a whole macOS run.
      - name: Install jolt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${JOLT_VERSION:?empty; the workflow-level pin did not resolve}"
          for attempt in 1 2 3; do
            if curl -fsSL \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github.raw" \
                 "https://api.github.com/repos/${JOLT_REPO}/contents/install" \
                 -o "$RUNNER_TEMP/jolt-install"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "could not fetch jolt's install script after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          bash "$RUNNER_TEMP/jolt-install" --version "$JOLT_VERSION"
          jolt --version

      # Pinned to match what the maintainer runs locally and what the
      # `bb hooks:install` pre-commit hook enforces. Floating these to `latest`
      # would let CI disagree with a clean local commit whenever clj-kondo or
      # clojure-lsp changes a default.
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: 1.12.196
          clj-kondo: "2026.05.25"
          cli: latest

      - uses: clojure-lsp/setup-clojure-lsp@v1.0.3
        with:
          clojure-lsp-version: "2026.05.05-12.58.26"

      # deps.edn pins glitter via :git/url + :git/sha rather than :local/root,
      # so jolt clones it during dependency resolution — no sibling checkout
      # needed on the runner.
      - name: Unit suite
        run: |
          set +e
          out="$(JOLT_PWD="$PWD" jolt -M:test 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            {
              printf '### `jolt -M:test` failed (exit %s)\n\n```\n%s\n```\n' \
                "$rc" "$(printf '%s\n' "$out" | tail -60)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # Formatting is owned by clojure-lsp, not cljfmt.
      - name: Formatting
        run: bb lsp:format-check

      - name: Namespace forms
        run: bb lsp:clean-ns-check

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          set +e
          echo "jolt:      $(command -v jolt || echo '<not on PATH>')"
          echo "gtk4 libs: $(ls -1 "$(brew --prefix)/lib" 2>/dev/null | grep -c 'libgtk-4' || echo 0)"
          echo "macOS:     $(sw_vers -productVersion)"
          echo "deps:"
          JOLT_PWD="$PWD" jolt path 2>&1 | tr ':' '\n' | head -20
